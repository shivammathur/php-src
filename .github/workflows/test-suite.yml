---
name: Test suite
permissions:
  contents: read
jobs:
  ALPINE:
    if: "${{ fromJson(inputs.branch).jobs.ALPINE }}"
    name: ALPINE_X64_ASAN_DEBUG_ZTS
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: alpine:3.22
    steps:
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: apk
      uses: "./.github/actions/apk"
    - name: System info
      run: |
        echo "::group::Show host CPU info"
        lscpu
        echo "::endgroup::"
        echo "::group::Show installed package versions"
        apk list
        echo "::endgroup::"
    - name: ccache
      uses: "./.github/actions/ccache"
      with:
        name: "${{ github.job }}"
        cc: clang-20
        cxx: clang++-20
    - name: "./configure"
      uses: "./.github/actions/configure-alpine"
      with:
        configurationParameters: CFLAGS="-fsanitize=undefined,address -fno-sanitize=function
          -DZEND_TRACK_ARENA_ALLOC" LDFLAGS="-fsanitize=undefined,address -fno-sanitize=function"
          --enable-debug --enable-zts
        skipSlow: true
    - name: make
      run: make -j$(/usr/bin/nproc) >/dev/null
      id: build
    - name: make install
      uses: "./.github/actions/install-alpine"
    - name: Verify source, debug runtime, and JIT startup
      shell: bash
      run: |
        set -eu
        printf '%s\n' '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df' > source-commit.txt
        cat source-commit.txt
        sapi/cli/php -n -d zend_extension="$PWD/modules/opcache.so" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)["jit"]??[]; $data=["version"=>PHP_VERSION,"debug"=>PHP_DEBUG,"zts"=>PHP_ZTS,"bits"=>PHP_INT_SIZE*8,"os"=>PHP_OS_FAMILY,"jit"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv("EXPECT_JIT")!=="0" && !($jit["on"]??false))) {exit(1);} $hashes=json_decode("{\"ext/opcache/jit/zend_jit.c\":\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\",\"ext/opcache/shared_alloc_win32.c\":\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\",\"ext/opcache/tests/jit/gh25213.phpt\":\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\"}",true); foreach ($hashes as $path=>$expected) { if (hash_file("sha256",$path)!==$expected) {fwrite(STDERR, "Source hash mismatch: $path\n");exit(1);} }' > debug-runtime.json
        cat debug-runtime.json
      id: verify
    - name: Test Tracing JIT
      uses: "./.github/actions/test-alpine"
      with:
        enableOpcache: true
        jitType: tracing
        runTestsParameters: "--asan -x"
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
      env:
        TEST_PHP_JUNIT: test-tracing-jit.xml
    - name: Extra tests
      uses: "./.github/actions/extra-tests"
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-alpine-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
    env:
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
  LINUX_X64:
    if: "${{ fromJson(inputs.branch).jobs.LINUX_X64 }}"
    services:
      mysql:
        image: mysql:8.4
        ports:
        - 3306:3306
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: root
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
      firebird:
        image: jacobalberty/firebird
        ports:
        - 3050:3050
        env:
          ISC_PASSWORD: test
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: test
          FIREBIRD_PASSWORD: test
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(inputs.branch).jobs.LINUX_X64.matrix }}"
    name: LINUX_X64${{ matrix.name }}_${{ matrix.debug && 'DEBUG' || 'RELEASE' }}_${{
      matrix.zts && 'ZTS' || 'NTS' }}
    runs-on: ubuntu-${{ fromJson(inputs.branch).config.ubuntu_version }}
    timeout-minutes: 180
    steps:
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: Create MSSQL container
      uses: "./.github/actions/setup-mssql"
    - name: apt
      uses: "./.github/actions/apt-x64"
      with:
        asan: "${{ matrix.asan && 'true' || 'false' }}"
    - name: System info
      run: |
        echo "::group::Show host CPU info"
        lscpu
        echo "::endgroup::"
        echo "::group::Show installed package versions"
        dpkg -l
        echo "::endgroup::"
    - name: Setup Caddy server
      uses: "./.github/actions/setup-caddy"
    - name: ccache
      uses: "./.github/actions/ccache"
      with:
        name: LINUX_X64${{ matrix.name }}_${{ matrix.debug && 'DEBUG' || 'RELEASE'
          }}_${{ matrix.zts && 'ZTS' || 'NTS' }}
    - name: "./configure"
      uses: "./.github/actions/configure-x64"
      with:
        configurationParameters: ${{ matrix.asan && 'CFLAGS="-fsanitize=undefined,address
          -DZEND_TRACK_ARENA_ALLOC" LDFLAGS="-fsanitize=undefined,address"' || ''
          }} ${{ matrix.variation && 'CFLAGS="-DZEND_RC_DEBUG=1 -DPROFITABILITY_CHECKS=0
          -DZEND_VERIFY_FUNC_INFO=1 -DZEND_VERIFY_TYPE_INFERENCE"' || '' }} ${{ (matrix.variation
          && fromJson(inputs.branch).jobs.LINUX_X64.config.variation_enable_zend_max_execution_timers)
          && '--enable-zend-max-execution-timers' || '' }} --${{ matrix.debug && 'enable'
          || 'disable' }}-debug ${{ (matrix.variation || matrix.debug) && format('CXXFLAGS="{0}
          {1}"', matrix.variation && '-DZEND_VERIFY_TYPE_INFERENCE' || '', matrix.debug
          && '-D_GLIBCXX_ASSERTIONS' || '') || '' }} --${{ matrix.zts && 'enable'
          || 'disable' }}-zts
        asan: "${{ matrix.asan && 'true' || 'false' }}"
        skipSlow: "${{ (matrix.asan && !inputs.all_variations) && 'true' || 'false'
          }}"
    - name: make
      run: make -j$(/usr/bin/nproc) >/dev/null
      id: build
    - name: make install
      uses: "./.github/actions/install-linux"
    - name: Verify source, debug runtime, and JIT startup
      shell: bash
      run: |
        set -eu
        printf '%s\n' '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df' > source-commit.txt
        cat source-commit.txt
        sapi/cli/php -n -d zend_extension="$PWD/modules/opcache.so" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)["jit"]??[]; $data=["version"=>PHP_VERSION,"debug"=>PHP_DEBUG,"zts"=>PHP_ZTS,"bits"=>PHP_INT_SIZE*8,"os"=>PHP_OS_FAMILY,"jit"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv("EXPECT_JIT")!=="0" && !($jit["on"]??false))) {exit(1);} $hashes=json_decode("{\"ext/opcache/jit/zend_jit.c\":\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\",\"ext/opcache/shared_alloc_win32.c\":\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\",\"ext/opcache/tests/jit/gh25213.phpt\":\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\"}",true); foreach ($hashes as $path=>$expected) { if (hash_file("sha256",$path)!==$expected) {fwrite(STDERR, "Source hash mismatch: $path\n");exit(1);} }' > debug-runtime.json
        cat debug-runtime.json
      id: verify
    - name: Setup
      if: "${{ !matrix.asan || inputs.all_variations }}"
      uses: "./.github/actions/setup-x64"
    - name: Test
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations
        || !matrix.asan) }}"
      uses: "./.github/actions/test-linux"
      with:
        runTestsParameters: "${{ matrix.asan && '--asan' || '' }} ${{ matrix.repeat
          && '--repeat 2' || '' }} ${{ matrix.variation && '-d zend_test.observer.enabled=1
          -d zend_test.observer.show_output=0' || '' }}"
        idleCpu: "${{ matrix.asan && 'true' || 'false' }}"
      env:
        TEST_PHP_JUNIT: test.xml
    - name: Test Tracing JIT
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations
        || matrix.asan) }}"
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
        jitType: tracing
        runTestsParameters: "${{ matrix.asan && '--asan' || '' }} ${{ (matrix.asan
          && !inputs.all_variations) && '-x' || '' }} ${{ matrix.repeat && '--repeat
          2' || '' }} ${{ matrix.variation && '-d zend_test.observer.enabled=1 -d
          zend_test.observer.show_output=0' || '' }}"
      env:
        TEST_PHP_JUNIT: test-tracing-jit.xml
    - name: Test OpCache
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations)
        }}"
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
        runTestsParameters: "${{ matrix.asan && '--asan' || '' }} ${{ matrix.repeat
          && '--repeat 2' || '' }} ${{ matrix.variation && '-d zend_test.observer.enabled=1
          -d zend_test.observer.show_output=0' || '' }}"
      env:
        TEST_PHP_JUNIT: test-opcache.xml
    - name: Test Function JIT
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (!matrix.asan)
        }}"
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
        jitType: function
        runTestsParameters: "${{ matrix.repeat && '--repeat 2' || '' }} ${{ matrix.variation
          && '-d zend_test.observer.enabled=1 -d zend_test.observer.show_output=0'
          || '' }}"
      env:
        TEST_PHP_JUNIT: test-function-jit.xml
    - name: Extra tests
      uses: "./.github/actions/extra-tests"
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
    - name: Verify generated files are up to date
      uses: "./.github/actions/verify-generated-files"
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-linux_x64-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
    env:
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
  LINUX_X32:
    if: "${{ fromJson(inputs.branch).jobs.LINUX_X32 }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(inputs.branch).jobs.LINUX_X32.matrix }}"
    name: LINUX_X32_${{ matrix.debug && 'DEBUG' || 'RELEASE' }}_${{ matrix.zts &&
      'ZTS' || 'NTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ubuntu:${{ fromJson(inputs.branch).config.ubuntu_version }}
    env:
      MYSQL_TEST_HOST: mysql
      PDO_MYSQL_TEST_DSN: mysql:host=mysql;dbname=test
      PDO_MYSQL_TEST_HOST: mysql
      PDO_FIREBIRD_TEST_DSN: firebird:dbname=firebird:test.fdb
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
    services:
      mysql:
        image: mysql:8.4
        ports:
        - 3306:3306
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: root
      firebird:
        image: jacobalberty/firebird
        ports:
        - 3050:3050
        env:
          ISC_PASSWORD: test
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: test
          FIREBIRD_PASSWORD: test
    steps:
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: apt
      uses: "./.github/actions/apt-x32"
    - name: ccache
      uses: "./.github/actions/ccache"
      with:
        name: LINUX_X32_${{ matrix.debug && 'DEBUG' || 'RELEASE' }}_${{ matrix.zts
          && 'ZTS' || 'NTS' }}
    - name: System info
      run: |
        echo "::group::Show host CPU info"
        lscpu
        echo "::endgroup::"
        echo "::group::Show installed package versions"
        dpkg -l
        echo "::endgroup::"
    - name: "./configure"
      uses: "./.github/actions/configure-x32"
      with:
        configurationParameters: "--${{ matrix.debug && 'enable' || 'disable' }}-debug
          --${{ matrix.zts && 'enable' || 'disable' }}-zts"
    - name: make
      run: make -j$(/usr/bin/nproc) >/dev/null
      id: build
    - name: make install
      uses: "./.github/actions/install-linux-x32"
    - name: Verify source, debug runtime, and JIT startup
      shell: bash
      run: |
        set -eu
        printf '%s\n' '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df' > source-commit.txt
        cat source-commit.txt
        sapi/cli/php -n -d zend_extension="$PWD/modules/opcache.so" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)["jit"]??[]; $data=["version"=>PHP_VERSION,"debug"=>PHP_DEBUG,"zts"=>PHP_ZTS,"bits"=>PHP_INT_SIZE*8,"os"=>PHP_OS_FAMILY,"jit"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv("EXPECT_JIT")!=="0" && !($jit["on"]??false))) {exit(1);} $hashes=json_decode("{\"ext/opcache/jit/zend_jit.c\":\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\",\"ext/opcache/shared_alloc_win32.c\":\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\",\"ext/opcache/tests/jit/gh25213.phpt\":\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\"}",true); foreach ($hashes as $path=>$expected) { if (hash_file("sha256",$path)!==$expected) {fwrite(STDERR, "Source hash mismatch: $path\n");exit(1);} }' > debug-runtime.json
        cat debug-runtime.json
      id: verify
    - name: Test
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations)
        }}"
      uses: "./.github/actions/test-linux"
      env:
        TEST_PHP_JUNIT: test.xml
    - name: Test Tracing JIT
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
        jitType: tracing
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
      env:
        TEST_PHP_JUNIT: test-tracing-jit.xml
    - name: Test OpCache
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations)
        }}"
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
      env:
        TEST_PHP_JUNIT: test-opcache.xml
    - name: Test Function JIT
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations)
        }}"
      uses: "./.github/actions/test-linux"
      with:
        enableOpcache: true
        jitType: function
      env:
        TEST_PHP_JUNIT: test-function-jit.xml
    - name: Extra tests
      uses: "./.github/actions/extra-tests"
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-linux_x32-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
  MACOS:
    if: "${{ fromJson(inputs.branch).jobs.MACOS }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(inputs.branch).jobs.MACOS.matrix }}"
    name: MACOS_${{ matrix.arch }}_${{ matrix.debug && 'DEBUG' || 'RELEASE' }}_${{
      matrix.zts && 'ZTS' || 'NTS' }}
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 180
    steps:
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: Update clang
      timeout-minutes: 10
      uses: "./.github/actions/macos-update-clang"
    - name: brew
      timeout-minutes: 20
      run: |
        set -eux
        # Match the frozen Intel runner image, retaining its bottled dependency set.
        core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
        mkdir -p "$core"
        git -C "$core" init
        git -C "$core" fetch --depth=1 https://github.com/Homebrew/homebrew-core.git 229d435d9fc7d166b417e94ce66db01d6b34cf97
        git -C "$core" checkout --detach FETCH_HEAD
        brew install --force-bottle --overwrite autoconf webp tidy-html5 libzip libsodium icu4c bison re2c bzip2 enchant libffi intltool libiconv t1lib libxml2 libjpeg libxslt openssl@3
        brew list --versions > dependency-versions.txt
        cat dependency-versions.txt
    - name: ccache
      uses: "./.github/actions/ccache"
      with:
        name: MACOS_${{ matrix.arch }}_${{ matrix.debug && 'DEBUG' || 'RELEASE' }}_${{
          matrix.zts && 'ZTS' || 'NTS' }}
    - name: "./configure"
      uses: "./.github/actions/configure-macos"
      with:
        configurationParameters: "--${{ matrix.debug && 'enable' || 'disable' }}-debug
          --${{ matrix.zts && 'enable' || 'disable' }}-zts"
    - name: make
      run: |-
        export PATH="$(brew --prefix)/opt/bison/bin:$PATH"
        make -j$(sysctl -n hw.logicalcpu) >/dev/null
      id: build
    - name: make install
      run: sudo make install
    - name: Verify source, debug runtime, and JIT startup
      shell: bash
      run: |
        set -eu
        printf '%s\n' '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df' > source-commit.txt
        cat source-commit.txt
        sapi/cli/php -n -d zend_extension="$PWD/modules/opcache.so" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)["jit"]??[]; $data=["version"=>PHP_VERSION,"debug"=>PHP_DEBUG,"zts"=>PHP_ZTS,"bits"=>PHP_INT_SIZE*8,"os"=>PHP_OS_FAMILY,"jit"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv("EXPECT_JIT")!=="0" && !($jit["on"]??false))) {exit(1);} $hashes=json_decode("{\"ext/opcache/jit/zend_jit.c\":\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\",\"ext/opcache/shared_alloc_win32.c\":\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\",\"ext/opcache/tests/jit/gh25213.phpt\":\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\"}",true); foreach ($hashes as $path=>$expected) { if (hash_file("sha256",$path)!==$expected) {fwrite(STDERR, "Source hash mismatch: $path\n");exit(1);} }' > debug-runtime.json
        cat debug-runtime.json
      id: verify
    - name: Test
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations)
        }}"
      uses: "./.github/actions/test-macos"
      env:
        TEST_PHP_JUNIT: test.xml
    - name: Test Tracing JIT
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && !(matrix.arch
        == 'ARM64' && matrix.zts) }}"
      uses: "./.github/actions/test-macos"
      with:
        enableOpcache: true
        jitType: tracing
      env:
        TEST_PHP_JUNIT: test-tracing-jit.xml
    - name: Test OpCache
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && (inputs.all_variations
        || matrix.zts) }}"
      uses: "./.github/actions/test-macos"
      with:
        enableOpcache: true
      env:
        TEST_PHP_JUNIT: test-opcache.xml
    - name: Test Function JIT
      if: "${{ !cancelled() && steps.verify.outcome == 'success' && !(matrix.arch
        == 'ARM64' && matrix.zts) }}"
      uses: "./.github/actions/test-macos"
      with:
        enableOpcache: true
        jitType: function
      env:
        TEST_PHP_JUNIT: test-function-jit.xml
    - name: Extra tests
      uses: "./.github/actions/extra-tests"
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
    - name: Verify generated files are up to date
      uses: "./.github/actions/verify-generated-files"
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-macos-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
    env:
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
      EXPECT_JIT: "${{ matrix.arch == 'ARM64' && matrix.zts && '0' || '1' }}"
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
  WINDOWS:
    if: "${{ fromJson(inputs.branch).jobs.WINDOWS }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(inputs.branch).jobs.WINDOWS.matrix }}"
    name: WINDOWS_${{ matrix.x64 && 'X64' || 'X86' }}_DEBUG_${{ matrix.zts && 'ZTS'
      || 'NTS' }}
    runs-on: "${{ fromJson(inputs.branch).jobs.WINDOWS.config.runs_on }}"
    timeout-minutes: 180
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.8.4
      PHP_BUILD_CRT: "${{ fromJson(inputs.branch).jobs.WINDOWS.config.vs_crt_version
        }}"
      PLATFORM: "${{ matrix.x64 && 'x64' || 'x86' }}"
      THREAD_SAFE: "${{ matrix.zts && '1' || '0' }}"
      INTRINSICS: "${{ matrix.zts && 'AVX2' || '' }}"
      PARALLEL: "${{ matrix.asan && '-j2' || fromJson(inputs.branch).config.default_run_test_jobs
        }}"
      OPCACHE: "${{ matrix.opcache && '1' || '0' }}"
      ASAN: "${{ matrix.asan && '1' || '0' }}"
      CLANG_TOOLSET: "${{ matrix.clang && '1' || '0' }}"
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
      ADD_CONF: "--enable-debug"
      CL: "/wd5287"
    steps:
    - name: git config
      run: git config --global core.autocrlf false && git config --global core.eol
        lf
      shell: cmd
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: Setup
      uses: "./.github/actions/setup-windows"
    - name: Build
      run: ".github/scripts/windows/build.bat"
      shell: cmd
      id: build
    - name: Verify source, debug runtime, and JIT startup
      shell: pwsh
      run: |
        git rev-parse HEAD | Tee-Object source-commit.txt
        if ((git rev-parse HEAD) -ne '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df') { throw 'Wrong source commit' }
        $build = 'C:\obj\Debug' + $(if ($env:THREAD_SAFE -eq '1') { '_TS' } else { '' })
        Copy-Item "C:\build-cache\deps-8.4-vs17-$env:PLATFORM\bin\*.dll" $build -Force
        & "$build\php.exe" -n "-dzend_extension=$build\php_opcache.dll" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)["jit"]??[]; $data=["version"=>PHP_VERSION,"debug"=>PHP_DEBUG,"zts"=>PHP_ZTS,"bits"=>PHP_INT_SIZE*8,"os"=>PHP_OS_FAMILY,"jit"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv("EXPECT_JIT")!=="0" && !($jit["on"]??false))) {exit(1);} $hashes=json_decode("{\"ext/opcache/jit/zend_jit.c\":\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\",\"ext/opcache/shared_alloc_win32.c\":\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\",\"ext/opcache/tests/jit/gh25213.phpt\":\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\"}",true); foreach ($hashes as $path=>$expected) { if (hash_file("sha256",$path)!==$expected) {fwrite(STDERR, "Source hash mismatch: $path\n");exit(1);} }' | Tee-Object debug-runtime.json
        if ($LASTEXITCODE -ne 0) { throw 'Debug JIT startup failed' }
      id: verify
    - name: Use the debug build for the Windows test harness
      shell: pwsh
      run: |
        $path = '.github/scripts/windows/test_task.bat'
        $text = [IO.File]::ReadAllText($path)
        $old = 'set PHP_BUILD_DIR=%PHP_BUILD_OBJ_DIR%\Release'
        if (!$text.Contains($old)) { throw 'Expected build directory setting missing' }
        [IO.File]::WriteAllText($path, $text.Replace($old, 'set PHP_BUILD_DIR=%PHP_BUILD_OBJ_DIR%\Debug'))
    - name: Test
      run: ".github/scripts/windows/test.bat"
      shell: cmd
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
    - name: Run and verify the OPcache regression suite
      if: "${{ !cancelled() && steps.verify.outcome == 'success' }}"
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $build = 'C:\obj\Debug' + $(if ($env:THREAD_SAFE -eq '1') { '_TS' } else { '' })
        # Avoid loading every unrelated debug extension during test discovery.
        $extdir = Join-Path $env:RUNNER_TEMP 'opcache-test-extensions'
        New-Item -ItemType Directory -Force $extdir | Out-Null
        $env:TEST_PHP_EXECUTABLE = "$build\php.exe"
        $env:TEST_PHP_JUNIT = 'opcache-tests.xml'
        & "$build\php.exe" -n run-tests.php -n -d "extension_dir=$extdir" -d "zend_extension=$build\php_opcache.dll" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -d opcache.protect_memory=1 -q -j2 --offline --show-diff --no-progress -g FAIL,BORK,LEAK,XLEAK ext/opcache
        $testExit = $LASTEXITCODE
        [xml]$junit = Get-Content opcache-tests.xml -Raw
        foreach ($test in @('gh25213.phpt', 'gh16821.phpt', 'gh24337.phpt')) {
          $cases = @($junit.SelectNodes('//testcase') | Where-Object { $_.name.Contains($test) })
          if ($cases.Count -ne 1 -or $cases[0].SelectNodes('skipped|failure|error').Count -ne 0) { throw "Required test did not pass: $test" }
          Write-Host "Confirmed PASS: $test"
        }
        if ($testExit -ne 0) { throw "OPcache suite failed: $testExit" }
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-windows-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
  FREEBSD:
    if: "${{ fromJson(inputs.branch).jobs.FREEBSD }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(inputs.branch).jobs.FREEBSD.matrix }}"
    name: FREEBSD_${{ matrix.zts && 'ZTS' || 'NTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: git checkout
      uses: actions/checkout@v7
      with:
        ref: "${{ fromJson(inputs.branch).ref }}"
    - name: Enable FreeBSD debug evidence collection
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p=Path('.github/actions/freebsd/action.yml')
        s=p.read_text().replace('copyback: false', 'copyback: true')
        marker='          export SKIP_IO_CAPTURE_TESTS=1'
        probe="set -eu\nprintf '%s\\n' '6d9c28800ee3aa3f8e8cc2f8d6838c561e5567df' > source-commit.txt\ncat source-commit.txt\nsapi/cli/php -n -d zend_extension=\"$PWD/modules/opcache.so\" -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M -r '$jit=opcache_get_status(false)[\"jit\"]??[]; $data=[\"version\"=>PHP_VERSION,\"debug\"=>PHP_DEBUG,\"zts\"=>PHP_ZTS,\"bits\"=>PHP_INT_SIZE*8,\"os\"=>PHP_OS_FAMILY,\"jit\"=>$jit]; echo json_encode($data, JSON_PRETTY_PRINT),PHP_EOL; if (!PHP_DEBUG || (getenv(\"EXPECT_JIT\")!==\"0\" && !($jit[\"on\"]??false))) {exit(1);} $hashes=json_decode(\"{\\\"ext/opcache/jit/zend_jit.c\\\":\\\"18a27c0cdc5363c3c6c86be939aaa3048afdfc84c040b9f2a42a3531822c7234\\\",\\\"ext/opcache/shared_alloc_win32.c\\\":\\\"6082689861b66c86186d4e139c73dd6597c724f025bd8a47a0923e723dc273a7\\\",\\\"ext/opcache/tests/jit/gh25213.phpt\\\":\\\"a488e5323e6b23075f4d2f08a46ad877e1a3f66dde4ef865c13f22dbdf4b31c8\\\"}\",true); foreach ($hashes as $path=>$expected) { if (hash_file(\"sha256\",$path)!==$expected) {fwrite(STDERR, \"Source hash mismatch: $path\\n\");exit(1);} }' > debug-runtime.json\ncat debug-runtime.json\n"
        s=s.replace(marker, ''.join('          '+line+'\n' for line in probe.splitlines())+'          export TEST_PHP_JUNIT=debug-tests.xml\n'+marker)
        p.write_text(s)
        PY
    - name: FreeBSD
      uses: "./.github/actions/freebsd"
      with:
        configurationParameters: "--${{ matrix.zts && 'enable' || 'disable' }}-zts"
        runExtraTests: true
    - name: Upload debug validation evidence
      if: "${{ always() }}"
      uses: actions/upload-artifact@v6
      with:
        name: debug-freebsd-${{ strategy.job-index }}
        retention-days: 7
        path: |
          source-commit.txt
          debug-runtime.json
          *.xml
          config.log
          config.nice*
          **/*.diff
          **/*.out
          **/*.log
          C:/obj/**/config.w32.h
        if-no-files-found: warn
    env:
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
      TEST_PHP_JUNIT: debug-tests.xml
'on':
  workflow_call:
    inputs:
      all_variations:
        required: true
        type: boolean
      branch:
        required: true
        type: string
